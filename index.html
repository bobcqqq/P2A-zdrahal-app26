<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Řeznictví U Zlatého nože</title>

<style>
body {
 margin: 0;
 font-family: Arial;
 background: #f5f5f5;
}

/* ✅ HEADER */
header {
 background: #b22222;
 color: white;
 text-align: center;
 padding: 20px;
}

/* ✅ LOGO */
.logo {
 text-align: center;
 margin: 20px;
}

.logo img {
 width: 140px;
}

/* ✅ GRID */
#items {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
 gap: 20px;
 padding: 20px;
}

/* ✅ KARTA PRODUKTU */
.card {
 background: white;
 border-radius: 10px;
 padding: 15px;
 box-shadow: 0 3px 10px rgba(0,0,0,0.1);
 transition: 0.3s;
 text-align: center;
}

.card:hover {
 transform: translateY(-5px);
 box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

.price {
 color: red;
 font-weight: bold;
 margin: 10px 0;
}

input[type="number"] {
 width: 60px;
}

/* ✅ PANEL (VYLEPŠENÝ) */
.panel {
 background: white;
 padding: 25px;
 margin: 20px auto;
 border-radius: 15px;
 max-width: 400px;
 text-align: center;
 box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

.panel input {
 width: 100%;
 padding: 10px;
 margin-top: 10px;
 border-radius: 5px;
 border: 1px solid #ccc;
}

/* ✅ TLAČÍTKO */
button {
 width: 200px;           /* menší */
 padding: 12px;
 margin: 15px auto;      /* centrování */
 display: block;
 font-size: 16px;
 background: red;
 color: white;
 border: none;
 border-radius: 8px;
 cursor: pointer;
}

button:hover {
 background: darkred;
}

/* ✅ SOUHRN */
.summary {
 margin-top: 10px;
 font-weight: bold;
}
</style>

</head>

<body>

<header>
<h1> Řeznictví U Zlatého nože</h1>
</header>

<!-- ✅ LOGO UPROSTŘED -->
<div class="logo">
<img src="logo.png">
</div>

<div id="items"></div>

<!-- ✅ PANEL UPROSTŘED -->
<div class="panel">
<div id="celkem" class="summary">Celkem: 0 Kč</div>
<div id="pocet" class="summary">Počet: 0</div>

<input type="text" id="jmeno" placeholder="Jméno">
<input type="email" id="email" placeholder="Email">
<input type="text" id="telefon" placeholder="Telefon">

<button onclick="odeslat()">Objednat</button>
</div>

<script>

let items = [];

async function loadCSV() {
 let r = await fetch("data_reznictvi.csv?t=" + Date.now());
 let t = await r.text();
 let lines = t.split("\\n");

 for (let i = 1; i < lines.length; i++) {
  let line = lines[i].trim();
  if (!line) continue;

  let [n, c] = line.split(",");
  items.push({nazev: n, cena: parseFloat(c), m: 0});
 }

 render();
}

function render() {
 let container = document.getElementById("items");
 container.innerHTML = "";

 items.forEach((it, i) => {
  let card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
   <h3>${it.nazev}</h3>
   <div class="price">${it.cena} Kč</div>
   <input type="number" min="0" onchange="update(${i}, this.value)">
  `;

  container.appendChild(card);
 });
}

function update(i, v) {
 items[i].m = parseInt(v) || 0;
 sum();
}

function sum() {
 let cel = 0, poc = 0;

 items.forEach(it => {
  cel += it.cena * it.m;
  poc += it.m;
 });

 celkem.innerText = "Celkem: " + cel + " Kč";
 pocet.innerText = "Počet: " + poc;
}

function odeslat() {
 let j = jmeno.value.trim();
 let e = email.value.trim();
 let t = telefon.value.trim();

 if (!j || !e || !t) {
  alert("Vyplň údaje");
  return;
 }

 let txt = "", cel = 0, poc = 0;

 items.forEach(it => {
  if (it.m > 0) {
   txt += it.nazev + " - " + it.m + " ks\\n";
   cel += it.m * it.cena;
   poc += it.m;
  }
 });

 if (!poc) {
  alert("Nic nevybráno");
  return;
 }

 let zprava =
  j + "\\n" + e + "\\n" + t + "\\n\\n" +
  txt + "\\nCelkem: " + cel + " Kč";

 window.location.href =
  "mailto:zdrahal.robin@kostka-skola.cz?subject=Objednávka&body=" +
  encodeURIComponent(zprava);
}

loadCSV();

</script>

</body>
</html>
``
