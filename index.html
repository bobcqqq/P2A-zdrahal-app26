<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Řeznictví U Zlatého nože</title>

<style>
body {
 font-family: Arial;
 background: white;
 margin: 0;
}

header {
 text-align: center;
 background: #b22222;
 color: white;
 padding: 20px;
}

.container {
 max-width: 700px;
 margin: 20px auto;
 padding: 20px;
}

/* ✅ BOX PRODUKTU */
.item {
 border: 2px solid red;
 border-radius: 10px;
 padding: 15px;
 margin-bottom: 10px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 background: #fff5f5;
}

/* ✅ INPUTY */
input[type="number"] {
 width: 60px;
}

input[type="text"], input[type="email"] {
 width: 100%;
 padding: 10px;
 margin-top: 10px;
 border: 1px solid #ccc;
 border-radius: 5px;
}

/* ✅ SOUHRN */
.summary {
 text-align: center;
 font-weight: bold;
 margin-top: 10px;
}

/* ✅ TLAČÍTKO */
button {
 width: 100%;
 padding: 15px;
 margin-top: 15px;
 font-size: 18px;
 background: red;
 color: white;
 border: none;
 border-radius: 10px;
 cursor: pointer;
}

button:hover {
 background: darkred;
}

.logo {
 text-align: center;
 margin: 20px;
}
</style>

</head>
<body>

<header>
<h1>Řeznictví U Zlatého nože</h1>
</header>

<!-- ✅ LOGO (vygenerované SVG) -->
<div class="logo">
<svg width="120" height="120">
 <circle cx="60" cy="60" r="50" fill="#b22222"/>
 <text x="50%" y="55%" text-anchor="middle" font-size="45" fill="white">🥩</text>
</svg>
</div>

<div class="container">

<div id="items"></div>

<div id="celkem" class="summary">Celková cena: 0 Kč</div>
<div id="pocet" class="summary">Počet kusů: 0</div>

<h3>Kontaktní údaje</h3>

<input type="text" id="jmeno" placeholder="Jméno a příjmení">
<input type="email" id="email" placeholder="Email">
<input type="text" id="telefon" placeholder="+420 000 000 000">

<button onclick="odeslatObjednavku()">ODESLAT OBJEDNÁVKU</button>

</div>

<script>

let items = [];

// ✅ načtení CSV
async function loadCSV() {
 let response = await fetch("data_reznictvi.csv?t=" + Date.now());
 let text = await response.text();
 let lines = text.split("\n");

 for (let i = 1; i < lines.length; i++) {
  let line = lines[i].trim();
  if (!line) continue;

  let [nazev, cena] = line.split(",");

  items.push({
   nazev: nazev,
   cena: parseFloat(cena),
   mnozstvi: 0
  });
 }

 renderItems();
}

// ✅ vykreslení produktů
function renderItems() {
 let container = document.getElementById("items");
 container.innerHTML = "";

 items.forEach((item, index) => {
  let div = document.createElement("div");
  div.className = "item";

  div.innerHTML = `
    <span>${item.nazev} (${item.cena} Kč)</span>
    <input type="number" min="0"
    onchange="updateItem(${index}, this.value)">
  `;

  container.appendChild(div);
 });
}

// ✅ změna množství
function updateItem(index, value) {
 items[index].mnozstvi = parseInt(value) || 0;
 updateSummary();
}

// ✅ výpočet
function updateSummary() {
 let celkem = 0;
 let pocet = 0;

 items.forEach(item => {
  celkem += item.cena * item.mnozstvi;
  pocet += item.mnozstvi;
 });

 document.getElementById("celkem").innerText =
  "Celková cena: " + celkem + " Kč";

 document.getElementById("pocet").innerText =
  "Počet kusů: " + pocet;
}

// ✅ odeslání (OPRAVENO)
function odeslatObjednavku() {

 let jmeno = document.getElementById("jmeno").value.trim();
 let email = document.getElementById("email").value.trim();
 let telefon = document.getElementById("telefon").value.trim();

 if (!jmeno || !email || !telefon) {
  alert("Vyplň všechny údaje!");
  return;
 }

 let textPolozky = "";
 let celkem = 0;
 let pocet = 0;

 items.forEach(item => {
  if (item.mnozstvi > 0) {
   let cena = item.cena * item.mnozstvi;
   celkem += cena;
   pocet += item.mnozstvi;

   textPolozky += item.nazev + " - " + item.mnozstvi + " ks\\n";
  }
 });

 if (pocet === 0) {
  alert("Nevybral jsi žádné zboží!");
  return;
 }

 let zprava =
  "Jméno: " + jmeno + "\\n" +
  "Email: " + email + "\\n" +
  "Telefon: " + telefon + "\\n\\n" +
  "Položky:\\n" + textPolozky + "\\n" +
  "Celkem: " + celkem + " Kč";

 let mailto =
 "mailto:zdrahal.robin@kostka-skola.cz?subject=Objednávka&body=" +
 encodeURIComponent(zprava);

 window.location.href = mailto;
}

// start
loadCSV();

</script>

</body>
</html>
