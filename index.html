<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Řeznictví U Zlatého nože</title>

<style>
body {
 margin: 0;
 font-family: Arial;
 background: #f5f5f5;
}

/* HEADER */
header {
 background: #b22222;
 color: white;
 text-align: center;
 padding: 20px;
}

/* LOGO */
.logo {
 text-align: center;
 margin: 20px;
}

.logo img {
 width: 120px;
}

/* PRODUKTY GRID */
#items {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
 gap: 20px;
 padding: 20px;
}

/* KARTA PRODUKTU */
.card {
 background: white;
 border-radius: 12px;
 padding: 15px;
 box-shadow: 0 3px 10px rgba(0,0,0,0.1);
 text-align: center;
 transition: 0.3s;
}

.card:hover {
 transform: translateY(-5px);
 box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

.price {
 color: red;
 font-weight: bold;
 margin: 10px 0;
}

/* PANEL OBJEDNÁVKY */
.panel {
 background: white;
 padding: 20px;
 margin: 20px auto;
 border-radius: 15px;
 max-width: 400px;
 text-align: center;
 box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

.panel input {
 width: 100%;
 padding: 10px;
 margin-top: 10px;
}

/* BUTTON */
button {
 width: 200px;
 padding: 12px;
 margin: 15px auto;
 display: block;
 background: red;
 color: white;
 border: none;
 border-radius: 8px;
 cursor: pointer;
}

button:hover {
 background: darkred;
}
</style>

</head>

<body>

<header>
<h1> Řeznictví U Zlatého nože</h1>
</header>

<div class="logo">
<img src="logo.png">
</div>

<div id="items"></div>

<div class="panel">
<div id="celkem">Celkem: 0 Kč</div>
<div id="pocet">Počet: 0</div>

<input type="text" id="jmeno" placeholder="Jméno">
<input type="email" id="email" placeholder="Email">
<input type="text" id="telefon" placeholder="Telefon">

<button onclick="odeslat()">Objednat</button>
</div>

<script>

let items = [];

// ✅ NAČTENÍ CSV
async function loadCSV() {
 try {
  let response = await fetch("./data_reznictvi.csv");

  if (!response.ok) {
   throw new Error("CSV nenalezeno");
  }

  let text = await response.text();
  let lines = text.split("\n");

  for (let i = 1; i < lines.length; i++) {
   let line = lines[i].trim();
   if (!line) continue;

   let [nazev, cena] = line.split(",");

   items.push({
    nazev: nazev,
    cena: parseFloat(cena),
    mnozstvi: 0
   });
  }

  render();

 } catch (err) {
  alert("Chyba načítání CSV!");
  console.error(err);
 }
}

// ✅ VYKRESLENÍ PRODUKTŮ
function render() {
 let container = document.getElementById("items");
 container.innerHTML = "";

 items.forEach((item, i) => {
  let card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <h3>${item.nazev}</h3>
    <div class="price">${item.cena} Kč</div>
    <input type="number" min="0" onchange="update(${i}, this.value)">
  `;

  container.appendChild(card);
 });
}

// ✅ AKTUALIZACE
function update(i, value) {
 items[i].mnozstvi = parseInt(value) || 0;
 updateSum();
}

// ✅ VÝPOČET
function updateSum() {
 let celkem = 0;
 let pocet = 0;

 items.forEach(item => {
  celkem += item.cena * item.mnozstvi;
  pocet += item.mnozstvi;
 });

 document.getElementById("celkem").innerText =
  "Celkem: " + celkem + " Kč";

 document.getElementById("pocet").innerText =
  "Počet: " + pocet;
}

// ✅ ODESLÁNÍ OBJEDNÁVKY
function odeslat() {

 let j = document.getElementById("jmeno").value.trim();
 let e = document.getElementById("email").value.trim();
 let t = document.getElementById("telefon").value.trim();

 if (!j || !e || !t) {
  alert("Vyplň údaje");
  return;
 }

 let text = "";
 let celkem = 0;
 let pocet = 0;

 items.forEach(item => {
  if (item.mnozstvi > 0) {
   text += item.nazev + " - " + item.mnozstvi + " ks\n";
   celkem += item.mnozstvi * item.cena;
   pocet += item.mnozstvi;
  }
 });

 if (pocet === 0) {
  alert("Nic nevybráno");
  return;
 }

 let zprava =
  "Jméno: " + j + "\n" +
  "Email: " + e + "\n" +
  "Telefon: " + t + "\n\n" +
  text +
  "\nCelkem: " + celkem + " Kč";

 window.location.href =
  "mailto:zdrahal.robin@kostka-skola.cz?subject=Objednávka&body=" +
  encodeURIComponent(zprava);
}

// ✅ START
loadCSV();

</script>

</body>
</html>
