<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Řeznictví U Zlatého nože</title>
<style>
body {margin:0;font-family:Arial;background:#f5f5f5}
header{text-align:center;background:#b22222;color:white;padding:20px}
.logo{text-align:center;margin:20px}
.logo img{width:140px}
#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px}
.card{background:white;border-radius:10px;padding:15px;box-shadow:0 3px 10px rgba(0,0,0,0.1);transition:0.3s;text-align:center}
.card:hover{transform:translateY(-5px);box-shadow:0 5px 20px rgba(0,0,0,0.2)}
.price{color:red;font-weight:bold;margin:10px 0}
.panel{background:white;padding:25px;margin:20px auto;border-radius:15px;max-width:400px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,0.15)}
.panel input{width:100%;padding:10px;margin-top:10px}
button{width:200px;padding:12px;margin:15px auto;display:block;background:red;color:white;border:none;border-radius:8px}
button:hover{background:darkred}
</style>
</head>
<body>
<header><h1>🥩 Řeznictví U Zlatého nože</h1></header>
<div class="logo"><img src="logo.png"></div>
<div id="items"></div>
<div class="panel">
<div id="celkem">Celkem: 0 Kč</div>
<div id="pocet">Počet: 0</div>
<input id="jmeno" placeholder="Jméno">
<input id="email" placeholder="Email">
<input id="telefon" placeholder="Telefon">
<button onclick="odeslat()">Objednat</button>
</div>
<script>
let items=[];

async function loadCSV(){
 try{
  let r=await fetch("./data_reznictvi.csv");
  let t=await r.text();
  let lines=t.split("
");

  for(let i=1;i<lines.length;i++){
   let l=lines[i].trim();
   if(!l) continue;

   let [nazev,cena]=l.split(",");

   items.push({nazev:nazev,cena:parseFloat(cena),mnozstvi:0});
  }

  render();
 }
 catch(e){alert("Nepodařilo se načíst CSV");}
}

function render(){
 let cont=document.getElementById("items");
 cont.innerHTML="";

 items.forEach((it,i)=>{
  let d=document.createElement("div");
  d.className="card";

  d.innerHTML=`
   <h3>${it.nazev}</h3>
   <div class='price'>${it.cena} Kč</div>
   <input type='number' min='0' onchange='upd(${i},this.value)'>
  `;

  cont.appendChild(d);
 });
}

function upd(i,v){
 items[i].mnozstvi=parseInt(v)||0;
 sum();
}

function sum(){
 let cel=0,p=0;

 items.forEach(it=>{
  cel+=it.cena*it.mnozstvi;
  p+=it.mnozstvi;
 });

 document.getElementById("celkem").innerText="Celkem: "+cel+" Kč";
 document.getElementById("pocet").innerText="Počet: "+p;
}

function odeslat(){
 let j=jmeno.value.trim();
 let e=email.value.trim();
 let t=telefon.value.trim();

 if(!j||!e||!t){alert("Vyplň údaje");return;}

 let txt="";
 let cel=0;
 let p=0;

 items.forEach(it=>{
  if(it.mnozstvi>0){
   txt+=it.nazev+" - "+it.mnozstvi+" ks
";
   cel+=it.mnozstvi*it.cena;
   p+=it.mnozstvi;
  }
 });

 if(!p){alert("Nic nevybráno");return;}

 let msg=
  "Jméno: "+j+"
"+
  "Email: "+e+"
"+
  "Telefon: "+t+"

"+
  txt+
  "
Celkem: "+cel+" Kč";

 window.location.href=
 "mailto:zdrahal.robin@kostka-skola.cz?subject=Objednávka&body="+
 encodeURIComponent(msg);
}

loadCSV();
</script>
</body>
</html>
