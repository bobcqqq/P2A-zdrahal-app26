<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Řeznictví U Zlatého nože</title>
<style>
body{font-family:Verdana;background:#1b1b1b;color:#eee;margin:0}
h1{background:#b22222;color:#fff;padding:20px;text-align:center;margin:0}
.container{max-width:600px;margin:20px auto;background:#2a2a2a;padding:20px;border-radius:10px}
.item{display:flex;justify-content:space-between;margin:10px 0}
input{margin-top:8px;padding:8px;width:100%}
#celkem,#pocet{text-align:center;font-weight:bold;margin-top:10px;color:#ff4444}
button{width:100%;padding:15px;margin-top:20px;background:#b22222;color:white;border:none;border-radius:8px;font-size:18px;cursor:pointer}
button:hover{background:#8b0000}
.logo{text-align:center;margin:10px}
</style>
</head>
<body>
<h1>Řeznictví U Zlatého nože</h1>

<div class="logo">
<svg width="100" height="100" viewBox="0 0 100 100">
<circle cx="50" cy="50" r="45" fill="#b22222" />
<text x="50%" y="55%" text-anchor="middle" fill="white" font-size="40">🥩</text>
</svg>
</div>

<div class="container">
<div id="items"></div>
<div id="celkem">Celkem: 0 Kč</div>
<div id="pocet">Počet: 0</div>

<input type="text" id="jmeno" placeholder="Jméno a příjmení">
<input type="email" id="email" placeholder="E-mail">
<input type="text" id="telefon" placeholder="+420 000 000 000">

<button onclick="odeslat()">ODESLAT OBJEDNÁVKU</button>
</div>

<script>
let items=[];

async function loadCSV(){
 const r=await fetch("data_reznictvi.csv?t="+Date.now());
 const t=await r.text();
 const lines=t.split("
");
 for(let i=1;i<lines.length;i++){
  let [n,c]=lines[i].split(";");
  if(n&&c){items.push({nazev:n,cena:parseFloat(c),m:0});}
 }
 render();
}

function render(){
 let c=document.getElementById("items");c.innerHTML="";
 items.forEach((it,i)=>{
  let d=document.createElement("div");d.className="item";
  d.innerHTML=`${it.nazev} (${it.cena} Kč) <input type='number' min='0' value='0' onchange='upd(${i},this.value)'>`;
  c.appendChild(d);
 });
}

function upd(i,v){items[i].m=parseInt(v)||0;sum();}

function sum(){
 let cel=0,poc=0;
 items.forEach(it=>{cel+=it.cena*it.m;poc+=it.m});
 document.getElementById("celkem").innerText="Celkem: "+cel+" Kč";
 document.getElementById("pocet").innerText="Počet: "+poc;
}

function odeslat(){
 let j=document.getElementById("jmeno").value;
 let e=document.getElementById("email").value;
 let t=document.getElementById("telefon").value;
 if(!j||!e||!t){alert("Vyplň vše");return}

 let txt="";let cel=0;let poc=0;
 items.forEach(it=>{
  if(it.m>0){txt+=it.nazev+" "+it.m+" ks
";cel+=it.m*it.cena;poc+=it.m}
 });
 if(!poc){alert("Nic nevybráno");return}

 let mail=`mailto:zdrahal.robin@kostka-skola.cz?subject=Objednávka&body=${encodeURIComponent(j+"
"+e+"
"+t+"

"+txt+"
Celkem:"+cel+" Kč")}`;
 window.location.href=mail;
}
loadCSV();
</script>

</body>
</html>
